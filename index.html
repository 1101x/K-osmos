<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한글 이름 여행</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <div id="hanok-eave" aria-hidden="true"></div>

  <h1 id="brand">한글 이름 여행</h1>

  <!-- 좌상단 방위 표시기 — 바늘(SVG)은 북쪽을 따라 돌고, 글자는 캔버스에 찍는다 -->
  <button id="compass-hud" class="hidden" type="button" aria-label="방위계: 북쪽을 위로 정렬" title="북쪽을 위로 정렬">
    <img class="compass-face" src="src/graphic/compass.svg" alt="">
    <canvas id="compass-canvas" width="308" height="308" aria-hidden="true"></canvas>
  </button>

  <!-- 이름 입력 -->
  <div id="input-wrap">
    <img class="input-frame" src="src/graphic/box_input.svg" alt="">
    <input id="nameInput" type="text" maxlength="40" placeholder="이름을 입력해 우주에 남겨보세요">
  </div>

  <div id="scene-container"></div>

  <div id="scale-hud">
    <p class="scale-label">지금 보고있는 곳</p>
    <p class="scale-name" id="scale-name"></p>
    <p class="scale-hint">마우스 스크롤 확대 / 우클릭 이동</p>
    <div class="view-btns">
      <button class="view-btn" id="btn-view-galaxy" type="button">우주보기</button>
      <button class="view-btn" id="btn-view-name" type="button">이름보기</button>
    </div>
  </div>

  <!-- 좌하단 이름풀이 열기 -->
  <button id="btn-reading">
    <span class="br-name"></span>
    <span class="br-label">이름 풀이 〉</span>
  </button>

  <!-- 우하단 자음 오행표 -->
  <aside id="ohaeng-legend">
    <img class="knot" src="src/graphic/knot.svg" alt="">
    <p class="lg-title">자음 오행표</p>
    <div class="lg-cols" id="ohaeng-cols"></div>
  </aside>

  <!-- 이름풀이 — 흑칠 자개(나전) 명함 -->
  <div id="reading-overlay" class="hidden">
    <button id="reading-close" aria-label="close">✕</button>
    <div id="reading-paper">
      <div class="rp-card">
        <!-- 자개 빛 그라디언트 정의 + 회(回)문 모서리 장식 -->
        <svg class="rp-corner tl" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="pearlStroke" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f2e9f5" />
              <stop offset=".25" stop-color="#ffd9e8" />
              <stop offset=".5" stop-color="#cfe3ff" />
              <stop offset=".75" stop-color="#d2f5e8" />
              <stop offset="1" stop-color="#fff3d6" />
            </linearGradient>
          </defs>
          <path d="M2 62 V14 Q2 2 14 2 H62 M12 62 V22 Q12 12 22 12 H62
                   M22 52 V30 Q22 22 30 22 H52 M30 44 V34 Q30 30 34 30 H44"
            fill="none" stroke="url(#pearlStroke)" stroke-width="1.6" opacity=".85" />
        </svg>
        <svg class="rp-corner tr" viewBox="0 0 64 64" aria-hidden="true"><path d="M2 62 V14 Q2 2 14 2 H62 M12 62 V22 Q12 12 22 12 H62 M22 52 V30 Q22 22 30 22 H52 M30 44 V34 Q30 30 34 30 H44" fill="none" stroke="url(#pearlStroke)" stroke-width="1.6" opacity=".85" /></svg>
        <svg class="rp-corner bl" viewBox="0 0 64 64" aria-hidden="true"><path d="M2 62 V14 Q2 2 14 2 H62 M12 62 V22 Q12 12 22 12 H62 M22 52 V30 Q22 22 30 22 H52 M30 44 V34 Q30 30 34 30 H44" fill="none" stroke="url(#pearlStroke)" stroke-width="1.6" opacity=".85" /></svg>
        <svg class="rp-corner br" viewBox="0 0 64 64" aria-hidden="true"><path d="M2 62 V14 Q2 2 14 2 H62 M12 62 V22 Q12 12 22 12 H62 M22 52 V30 Q22 22 30 22 H52 M30 44 V34 Q30 30 34 30 H44" fill="none" stroke="url(#pearlStroke)" stroke-width="1.6" opacity=".85" /></svg>

        <div class="rp-flow">
          <p class="rp-counts" id="reading-counts"></p>
          <h2 class="rp-name" id="reading-name"></h2>
          <p class="rp-traits" id="reading-traits"></p>
          <div class="rp-rule"><span>用神</span></div>
          <p class="rp-lack" id="reading-lack"></p>
          <dl class="rp-rx">
            <div class="rx-row">
              <dt>方位</dt>
              <dd id="reading-rx-dir"></dd>
            </div>
            <div class="rx-row">
              <dt>服色</dt>
              <dd id="reading-rx-wear"></dd>
            </div>
            <div class="rx-row">
              <dt>貴人</dt>
              <dd id="reading-rx-surname"></dd>
            </div>
          </dl>
        </div>
      </div>
    </div>
  </div>

  <footer id="timebar">
    <div class="datetime" id="datetime">—</div>
    <div class="transport">
      <button class="tp-btn" id="tp-rewind" title="처음부터 다시 작도" aria-label="맨 뒤로">‹</button>
      <button class="tp-btn" id="tp-pause" title="일시정지" aria-label="일시정지">⏸</button>
      <button class="tp-btn" id="tp-play" title="재생" aria-label="재생">▶</button>
      <button class="tp-btn" id="tp-end" title="작도 완료" aria-label="맨 앞으로">›</button>
    </div>
  </footer>

  <!-- 행성 클릭 → 자소 레터링 · 훈민정음 한지 UI -->
  <div id="letter-overlay" class="hidden">
    <div id="letter-stage"></div>

    <button id="letter-close" aria-label="close">✕</button>

    <aside id="letter-panel" class="hanji">
      <div class="hanji-rule"></div>
      <header class="hp-head">
        <div class="hp-orbitbox">
          <canvas id="letter-orbit" width="280" height="200"></canvas>
          <p class="hp-family" id="letter-family"></p>
        </div>
        <h2 id="letter-char">—</h2>
      </header>
      <div class="hp-cols">
        <dl class="hp-rows" id="letter-table"></dl>
        <dl class="hp-rows right" id="letter-table2"></dl>
      </div>
      <footer class="hp-foot">
        <p class="hp-quote" id="letter-quote"></p>
        <div class="seal">訓民<br>正音</div>
      </footer>
      <div class="hanji-rule-bottom"></div>
    </aside>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
