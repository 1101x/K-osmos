<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한글 이름 여행</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./src/lib/three.module.js",
      "three/addons/": "./src/lib/addons/"
    }
  }
  </script>
</head>

<body>

  <h1 id="brand" aria-label="한글 이름 여행">
    <span class="brand-word" aria-hidden="true"><span>한</span><span>글</span></span>
    <span class="brand-word" aria-hidden="true"><span>이</span><span>름</span></span>
    <span class="brand-word" aria-hidden="true"><span>여</span><span>행</span></span>
  </h1>

  <!-- 좌상단 방위 표시기 — 눈금판은 동쪽을, 바늘은 북쪽을 따로 따라 돌고, 글자는 캔버스에 찍는다 -->
  <button id="compass-hud" class="hidden" type="button" aria-label="방위계: 북쪽을 위로 정렬" title="북쪽을 위로 정렬">
    <img class="compass-ew" src="src/graphic/compass_ew.svg" alt="">
    <img class="compass-ns" src="src/graphic/compass_ns.svg" alt="">
    <canvas id="compass-canvas" width="308" height="308" aria-hidden="true"></canvas>
  </button>

  <!-- 이름 입력 -->
  <div id="input-wrap">
    <img class="input-frame" src="src/graphic/box_input.svg" alt="">
    <input id="nameInput" type="text" maxlength="5" placeholder="이름을 입력해 우주에 남겨보세요">
  </div>

  <div id="scene-container"></div>

  <div id="scale-hud">
    <p class="scale-label">지금 보고있는 곳</p>
    <p class="scale-name" id="scale-name"></p>
    <p class="scale-hint">마우스 스크롤 확대 / 우클릭 이동</p>
    <div class="view-btns">
      <button class="view-btn" id="btn-view-galaxy" type="button">우주보기</button>
      <button class="view-btn" id="btn-view-name" type="button">이름보기</button>
    </div>
  </div>

  <!-- 좌하단 이름풀이 열기 -->
  <button id="btn-reading">
    <span class="br-name"></span>
    <span>이름 풀이 〉</span>
  </button>

  <!-- 우하단 자음 오행표 -->
  <aside id="ohaeng-legend">
    <img class="knot" src="src/graphic/knot.svg" alt="">
    <p class="lg-title">자음 오행표</p>
    <div class="lg-cols" id="ohaeng-cols"></div>
  </aside>

  <!-- 이름풀이 — 피그마 card_name (틀은 src/graphic/card_frame.svg) -->
  <div id="reading-overlay" class="hidden">
    <button id="reading-close" aria-label="close">✕</button>
    <div id="reading-paper">
      <div class="rp-card">
        <img class="rp-frame" src="src/graphic/card_frame.svg" alt="">
        <div class="rp-flow">
          <h2 class="rp-name" id="reading-name"></h2>
          <p class="rp-traits" id="reading-traits"></p>
          <p class="rp-counts" id="reading-counts"></p>
          <dl class="rp-rx">
            <div class="rx-row">
              <dt>用神</dt>
              <dd id="reading-lack"></dd>
            </div>
            <div class="rx-col">
              <div class="rx-row">
                <dt>方位</dt>
                <dd id="reading-rx-dir"></dd>
              </div>
              <div class="rx-row">
                <dt>服色</dt>
                <dd id="reading-rx-wear"></dd>
              </div>
              <div class="rx-row">
                <dt>貴人</dt>
                <dd id="reading-rx-surname"></dd>
              </div>
            </div>
          </dl>
        </div>
      </div>
    </div>
  </div>

  <footer id="timebar">
    <div class="datetime" id="datetime">—</div>
    <div class="transport">
      <button class="tp-btn" id="tp-rewind" title="처음부터 다시 작도" aria-label="맨 뒤로">‹</button>
      <button class="tp-btn" id="tp-pause" title="일시정지" aria-label="일시정지">⏸</button>
      <button class="tp-btn" id="tp-play" title="재생" aria-label="재생">▶</button>
      <button class="tp-btn" id="tp-end" title="작도 완료" aria-label="맨 앞으로">›</button>
    </div>
  </footer>

  <!-- 행성 클릭 → 자소 풀이 카드 (피그마 card_jaso, 틀은 src/graphic/card_jaso_frame.svg) -->
  <div id="letter-overlay" class="hidden">
    <div id="letter-stage"></div>

    <button id="letter-close" aria-label="close">✕</button>

    <aside id="letter-panel">
      <img class="lp-frame" src="src/graphic/card_jaso_frame.svg" alt="">
      <div class="lp-body">
        <header class="lp-head">
          <p class="lp-family">
            <span class="lp-kind" id="letter-kind">子音</span>
            <span id="letter-family"></span>
          </p>
          <h2 id="letter-char">—</h2>
        </header>
        <div class="lp-cols">
          <dl class="lp-rows" id="letter-table"></dl>
          <dl class="lp-rows" id="letter-table2"></dl>
          <div class="lp-orbit">
            <span>軌道</span>
            <canvas id="letter-orbit" width="336" height="336"></canvas>
          </div>
        </div>
        <p class="lp-quote" id="letter-quote"></p>
      </div>
    </aside>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
