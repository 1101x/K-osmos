<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한글 이름 추상화 · 오행 태양계 SAMPLE</title>
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- 상단 헤더 (NASA Eyes 스타일) -->
<header id="topbar">
  <div class="brand">
    <div class="logo">☉</div>
    <h1>한글 이름 추상화 <span>오행 태양계 · SAMPLE</span></h1>
  </div>
  <nav class="menu">
    <button class="navlink" id="btn-reset">태양계</button>
    <button class="navlink" id="btn-cluster">성단</button>
    <button class="navlink" id="btn-galaxy">은하</button>
    <button class="hamburger" aria-label="menu"><span></span><span></span><span></span></button>
  </nav>
</header>

<!-- 3D 캔버스 -->
<div id="scene-container"></div>

<!-- 현재 스케일 표시 (좌측, NASA 'You are…' 스타일) -->
<div id="scale-hud">
  <p class="scale-label">현재 보고 있는 곳</p>
  <p class="scale-name" id="scale-name">태양계</p>
  <p class="scale-hint">스크롤로 줌아웃 해보세요</p>
</div>

<!-- 행성 선택 시 정보 패널 (좌하단) -->
<aside id="info-panel" class="hidden">
  <button id="panel-close" aria-label="close">✕</button>
  <p class="eyebrow" id="panel-element">水 · 수</p>
  <h2 id="panel-name">수성</h2>
  <p class="latin" id="panel-latin">MERCURY</p>
  <p class="desc" id="panel-desc"></p>
</aside>

<!-- 하단 타임바 (Eyes on Asteroids 스타일) -->
<footer id="timebar">
  <div class="live"><span class="dot"></span>LIVE</div>
  <div class="datetime" id="datetime">—</div>
  <div class="speed">
    <label for="speed-slider">공전 속도</label>
    <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1" />
  </div>
</footer>

<p id="credit">Planet textures © Solar System Scope (CC BY 4.0)</p>

<script type="module" src="js/main.js"></script>
</body>
</html>
